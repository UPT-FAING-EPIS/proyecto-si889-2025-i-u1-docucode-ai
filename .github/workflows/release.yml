name: Release PHP Project

on:
  push:
    tags:
      - 'v*'  # Se ejecutará cuando se haga push a un tag como 'v1.0.0'

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '7.4'

    - name: Install dependencies
      run: |
        cd DocuCodeAI
        composer install --no-interaction --prefer-dist

    - name: Create the release archive
      run: |
        mkdir release
        tar -czf release/docucodeai-${GITHUB_REF##*/}.tar.gz DocuCodeAI

    - name: Create GitHub Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        VERSION_TAG=${GITHUB_REF##*/}
        echo "Creating GitHub Release for version ${VERSION_TAG}"
        gh release create $VERSION_TAG release/docucodeai-${VERSION_TAG}.tar.gz --title "Release ${VERSION_TAG}" --notes "Release notes for version ${VERSION_TAG}"
