name: Crear Issues en Proyecto Existente

on:
  push:
    branches:
      - JarroJose
  workflow_dispatch:

jobs:
  crear-issues:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Validar JSON
        run: |
          if ! jq -e . .github/issue-list.json >/dev/null; then
            echo "::error::Error en el formato JSON"
            jq . .github/issue-list.json
            exit 1
          fi
          echo "✓ JSON válido"

      - name: Crear Issues en Proyecto
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          PROJECT_ID: "248"  # Verifica este ID
        run: |
          OWNER="UPT-FAING-EPIS"
          REPO="DOCUCODE-IA"

          # Paso 1: Obtener columnas del proyecto (con debug)
          echo "Obteniendo columnas del proyecto $PROJECT_ID..."
          COLUMNS_RESPONSE=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/projects/$PROJECT_ID/columns")

          HTTP_CODE=$(echo "$COLUMNS_RESPONSE" | tail -n1)
          COLUMNS_JSON=$(echo "$COLUMNS_RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Error al obtener columnas. Código: $HTTP_CODE"
            echo "$COLUMNS_JSON"
            exit 1
          fi

          # Paso 2: Extraer ID de la primera columna
          COLUMN_ID=$(echo "$COLUMNS_JSON" | jq -r '.[0].id')
          if [ "$COLUMN_ID" == "null" ]; then
            echo "::error::No se encontraron columnas en el proyecto"
            echo "$COLUMNS_JSON"
            exit 1
          fi
          echo "✓ Columna ID: $COLUMN_ID"

          # Paso 3: Crear issues
          jq -c '.[]' .github/issue-list.json | while read -r issue; do
            TITLE=$(echo "$issue" | jq -r '.title')
            BODY=$(echo "$issue" | jq -r '.body')

            # Crear issue
            echo "Creando issue: $TITLE..."
            ISSUE_JSON=$(curl -s -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -X POST "https://api.github.com/repos/$OWNER/$REPO/issues" \
              -d "{\"title\":\"$TITLE\",\"body\":\"$BODY\"}")

            ISSUE_ID=$(echo "$ISSUE_JSON" | jq -r '.id')
            NODE_ID=$(echo "$ISSUE_JSON" | jq -r '.node_id')

            # Agregar al proyecto
            curl -s -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -X POST "https://api.github.com/projects/columns/$COLUMN_ID/cards" \
              -d "{\"content_id\":\"$NODE_ID\",\"content_type\":\"Issue\"}"

            echo "✓ Issue creado: $TITLE (ID: $ISSUE_ID)"
          done