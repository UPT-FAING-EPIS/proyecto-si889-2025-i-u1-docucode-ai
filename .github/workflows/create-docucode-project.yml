name: Crear Proyecto DOCUCODE-IA con Issues

on:
  push:
    branches:
      - JarroJose
  workflow_dispatch:

jobs:
  crear-proyecto:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout del repositorio
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      # 2. Instalar GitHub CLI
      - name: Instalar GitHub CLI
        run: |
          sudo apt-get install gh -y

      # 3. Instalar jq (para manipular archivos JSON)
      - name: Instalar jq
        run: |
          sudo apt-get install jq -y

      # 4. Autenticarse con GitHub CLI usando el token desde GitHub Secrets
      - name: Autenticarse con GH CLI
        run: |
          echo "${{ secrets.GH_TOKEN }}" | gh auth login --with-token

      # 5. Crear el proyecto DOCUCODE-IA
      - name: Crear el proyecto DOCUCODE-IA
        id: crear_proyecto
        run: |
          gh project create --title "DOCUCODE-IA" --format json > project.json
          echo "PROJECT_ID=$(jq -r '.id' project.json)" >> $GITHUB_ENV

      # 6. Verificar si existe el archivo issue-list.json
      - name: Verificar si existe issue-list.json
        run: |
          if [ ! -f .github/issue-list.json ]; then
            echo "El archivo issue-list.json no existe en .github/"
            exit 1
          fi

      # 7. Crear Issues y añadirlos al Proyecto
      - name: Crear Issues y añadirlos al Proyecto
        run: |
          for row in $(jq -c '.[]' .github/issue-list.json); do
            TITLE=$(echo "$row" | jq -r '.title')
            BODY=$(echo "$row" | jq -r '.body')
            ISSUE_URL=$(gh issue create --title "$TITLE" --body "$BODY" --json url | jq -r '.url')
            gh project item-add $PROJECT_ID --url "$ISSUE_URL"
          done
