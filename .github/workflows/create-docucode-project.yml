name: Crear Proyecto DOCUCODE-IA con Issues

on:
  push:
    branches:
      - JarroJose
  workflow_dispatch:

jobs:
  crear-proyecto:
    runs-on: ubuntu-latest

    steps:
      # Paso 1: Checkout del repositorio
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      # Paso 2: Instalar GitHub CLI
      - name: Instalar GitHub CLI
        run: |
          sudo apt-get install gh -y

      # Paso 3: Instalar jq
      - name: Instalar jq
        run: |
          sudo apt-get install jq -y

      # Paso 4: Verificar si GH_TOKEN está disponible
      - name: Verificar GH_TOKEN
        run: |
          if [ -z "${{ secrets.GH_TOKEN }}" ]; then
            echo "El token GH_TOKEN no está configurado."
            exit 1
          else
            echo "GH_TOKEN está configurado correctamente."
          fi

      # Paso 5: Intentar autenticarse con GH CLI usando el token
      - name: Autenticarse con GH CLI
        run: |
          echo "${{ secrets.GH_TOKEN }}" | gh auth login --with-token
        continue-on-error: true  # Si hay un error, continúa con el flujo para verificarlo

      # Paso 6: Verificar si la autenticación fue exitosa
      - name: Verificar autenticación
        run: |
          gh auth status
        continue-on-error: true  # Si hay un error, lo capturamos para revisarlo

      # Paso 7: Crear el proyecto DOCUCODE-IA
      - name: Crear el proyecto DOCUCODE-IA
        id: crear_proyecto
        run: |
          if gh auth status; then
            gh project create --title "DOCUCODE-IA" --format json > project.json
            echo "PROJECT_ID=$(jq -r '.id' project.json)" >> $GITHUB_ENV
          else
            echo "La autenticación falló, no se puede crear el proyecto."
            exit 1
          fi

      # Paso 8: Verificar si existe issue-list.json
      - name: Verificar si existe issue-list.json
        run: |
          if [ ! -f .github/issue-list.json ]; then
            echo "El archivo issue-list.json no existe en .github/"
            exit 1
          else
            echo "Archivo issue-list.json encontrado."
          fi

      # Paso 9: Crear Issues y añadirlos al Proyecto
      - name: Crear Issues y añadirlos al Proyecto
        run: |
          for row in $(jq -c '.[]' .github/issue-list.json); do
            TITLE=$(echo "$row" | jq -r '.title')
            BODY=$(echo "$row" | jq -r '.body')
            ISSUE_URL=$(gh issue create --title "$TITLE" --body "$BODY" --json url | jq -r '.url')
            gh project item-add $PROJECT_ID --url "$ISSUE_URL"
          done
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
