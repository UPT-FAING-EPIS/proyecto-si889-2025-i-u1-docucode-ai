name: Crear Proyecto con Issues en ProjectV2

on:
  push:
    branches:
      - JarroJose
  workflow_dispatch:

jobs:
  crear-proyecto:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl

      - name: Autenticarse con GitHub
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          echo "$GH_TOKEN" | gh auth login --with-token

      - name: Crear Proyecto
        id: create_project
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          OWNER="UPT-FAING-EPIS"
          REPO="DOCUCODE-IA"
          
          # Crear proyecto con respuesta detallada
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -X POST "https://api.github.com/repos/$OWNER/$REPO/projects" \
            -d '{"name":"DOCUCODE-IA","body":"Proyecto usando nueva experiencia","visibility":"public"}')
          
          # Separar cuerpo de respuesta y código HTTP
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          
          if [ "$HTTP_CODE" != "201" ]; then
            echo "::error::Error creando proyecto. Código: $HTTP_CODE"
            echo "$BODY"
            exit 1
          fi
          
          PROJECT_ID=$(echo "$BODY" | jq -r '.id')
          echo "PROJECT_ID=$PROJECT_ID" >> $GITHUB_ENV
          echo "project_id=$PROJECT_ID" >> $GITHUB_OUTPUT
          
          echo "Proyecto creado con ID: $PROJECT_ID"

      - name: Verificar JSON
        run: |
          if ! jq -e . .github/issue-list.json >/dev/null; then
            echo "::error::Error en el formato JSON:"
            jq . .github/issue-list.json
            exit 1
          fi
          echo "JSON válido"

      - name: Crear Issues
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          OWNER="UPT-FAING-EPIS"
          REPO="DOCUCODE-IA"
          PROJECT_ID=${{ env.PROJECT_ID }}

          # Obtener columna del proyecto
          COLUMNS=$(curl -s \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/projects/$PROJECT_ID/columns")
          
          COLUMN_ID=$(echo "$COLUMNS" | jq -r '.[0].id')
          echo "COLUMN_ID=$COLUMN_ID" >> $GITHUB_ENV

          # Procesar issues
          while IFS= read -r issue; do
            TITLE=$(echo "$issue" | jq -r '.title')
            BODY=$(echo "$issue" | jq -r '.body')

            # Crear issue
            ISSUE=$(curl -s \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -X POST "https://api.github.com/repos/$OWNER/$REPO/issues" \
              -d "{\"title\":\"$TITLE\",\"body\":\"$BODY\"}")
            
            ISSUE_ID=$(echo "$ISSUE" | jq -r '.id')
            NODE_ID=$(echo "$ISSUE" | jq -r '.node_id')

            # Agregar al proyecto
            curl -s \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -X POST "https://api.github.com/projects/columns/$COLUMN_ID/cards" \
              -d "{\"content_id\":\"$NODE_ID\",\"content_type\":\"Issue\"}"

            echo "✔ Issue creado: $TITLE"
          done < <(jq -c '.[]' .github/issue-list.json)