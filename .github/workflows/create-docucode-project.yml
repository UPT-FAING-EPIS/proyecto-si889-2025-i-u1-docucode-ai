name: Crear Issues en Proyecto Classic

on:
  push:
    branches:
      - JarroJose
  workflow_dispatch:

jobs:
  crear-issues:
    runs-on: ubuntu-latest
    env:
      OWNER: UPT-FAING-EPIS
      REPO: DOCUCODE-IA
      PROJECT_NUMBER: "248"

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Validar estructura JSON
        run: |
          # Validación mejorada y más precisa
          if ! jq -e 'type == "array" and (.[] | has("title") and has("body"))' .github/issue-list.json >/dev/null; then
            echo "::error::Error en estructura JSON:"
            echo "1. Debe ser un array"
            echo "2. Cada elemento debe tener 'title' y 'body'"
            jq . .github/issue-list.json
            exit 1
          fi
          echo "✓ Validación JSON exitosa - Estructura correcta"

      - name: Obtener columnas del proyecto
        id: get-columns
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          API_URL="https://api.github.com/repos/$OWNER/$REPO/projects/$PROJECT_NUMBER/columns"
          
          response=$(curl -s -w "\nHTTP_CODE:%{http_code}" \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.inertia-preview+json" \
            "$API_URL")

          http_code=$(echo "$response" | awk -F: '/HTTP_CODE:/{print $2}')
          json_response=$(echo "$response" | sed '/HTTP_CODE:/d')

          if [ "$http_code" != "200" ]; then
            echo "::error::❌ Fallo al obtener columnas (Código $http_code)"
            echo "Respuesta de la API:"
            echo "$json_response" | jq .
            exit 1
          fi

          column_id=$(echo "$json_response" | jq -r '
            if type == "array" and length > 0 then 
              .[0].id 
            else 
              "null" 
            end
          ')
          
          if [ "$column_id" = "null" ] || [ -z "$column_id" ]; then
            echo "::error::🚫 No se encontraron columnas en el proyecto"
            echo "$json_response" | jq .
            exit 1
          fi

          echo "COLUMN_ID=$column_id" >> $GITHUB_ENV
          echo "✓ Columna obtenida: $column_id"

      - name: Crear issues
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          total=$(jq 'length' .github/issue-list.json)
          success_count=0
          fail_count=0
          
          jq -c '.[]' .github/issue-list.json | while read -r issue; do
            title=$(jq -r '.title' <<< "$issue")
            body=$(jq -r '.body' <<< "$issue")

            echo "🔄 Procesando: '$title'"
            
            # Crear issue
            issue_response=$(curl -s -w "\nHTTP_CODE:%{http_code}" \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -d "{\"title\":\"$title\",\"body\":\"$body\"}" \
              "https://api.github.com/repos/$OWNER/$REPO/issues")

            http_code=$(echo "$issue_response" | awk -F: '/HTTP_CODE:/{print $2}')
            issue_json=$(echo "$issue_response" | sed '/HTTP_CODE:/d')

            if [ "$http_code" != "201" ]; then
              echo "::error::❌ Fallo creando issue: $title"
              echo "Código: $http_code | Respuesta:"
              echo "$issue_json" | jq .
              ((fail_count++))
              continue
            fi

            issue_id=$(jq -r '.id' <<< "$issue_json")
            
            # Agregar al proyecto (usando ID numérico para Projects Classic)
            card_response=$(curl -s -w "\nHTTP_CODE:%{http_code}" \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github.inertia-preview+json" \
              -d "{\"content_id\":$issue_id, \"content_type\":\"Issue\"}" \
              "https://api.github.com/projects/columns/$COLUMN_ID/cards")

            card_http_code=$(echo "$card_response" | awk -F: '/HTTP_CODE:/{print $2}')
            card_json=$(echo "$card_response" | sed '/HTTP_CODE:/d')

            if [ "$card_http_code" = "201" ]; then
              echo "✅ Creado: $title (ID: $issue_id)"
              ((success_count++))
            else
              echo "::warning::⚠️ Issue creado pero no agregado al proyecto: $title"
              echo "Código: $card_http_code | Error:"
              echo "$card_json" | jq .
              ((fail_count++))
            fi

          done

          echo "📊 Resumen final:"
          echo " - Total: $total"
          echo " - Éxitos: $success_count"
          echo " - Fallos: $fail_count"
          
          if [ $fail_count -gt 0 ]; then
            exit 1
          fi