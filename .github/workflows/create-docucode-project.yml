name: Crear Proyecto Clásico con Issues

on:
  push:
    branches:
      - JarroJose
  workflow_dispatch:

jobs:
  crear-proyecto:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar GitHub CLI
        run: sudo apt-get install gh -y

      - name: Autenticarse con GitHub CLI
        run: |
          echo "${{ secrets.GH_TOKEN }}" | gh auth login --with-token

      - name: Crear Proyecto Clásico
        run: |
          gh project create "DOCUCODE-IA" --body "Proyecto clásico de prueba para issues." --visibility public

      - name: Crear archivo de Issues de ejemplo si no existe
        run: |
          if [ ! -f .github/issue-list.json ]; then
            echo '[{"title": "Issue 1", "body": "Descripción del issue 1"}, {"title": "Issue 2", "body": "Descripción del issue 2"}]' > .github/issue-list.json
          fi

      - name: Crear Issues
        run: |
          for row in $(jq -c '.[]' .github/issue-list.json); do
            TITLE=$(echo "$row" | jq -r '.title')
            BODY=$(echo "$row" | jq -r '.body')
            gh issue create --title "$TITLE" --body "$BODY"
          done
