name: Crear Issues en Proyecto Existente

on:
  push:
    branches:
      - JarroJose
  workflow_dispatch:

jobs:
  crear-issues:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar jq
        run: sudo apt-get install -y jq

      - name: Validar JSON
        run: |
          if ! jq -e . .github/issue-list.json >/dev/null; then
            echo "::error::Error en el formato JSON"
            jq . .github/issue-list.json
            exit 1
          fi
          echo "✓ JSON válido"

      - name: Crear Issues en Proyecto
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          PROJECT_ID: "248"  # ID del proyecto existente
        run: |
          OWNER="UPT-FAING-EPIS"
          REPO="DOCUCODE-IA"

          # Obtener columna "To do" del proyecto
          COLUMNS=$(curl -s \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/projects/$PROJECT_ID/columns")

          COLUMN_ID=$(echo "$COLUMNS" | jq -r '.[0].id')
          echo "::notice::Usando columna con ID: $COLUMN_ID"

          # Crear issues desde el JSON
          jq -c '.[]' .github/issue-list.json | while read -r issue; do
            TITLE=$(echo "$issue" | jq -r '.title')
            BODY=$(echo "$issue" | jq -r '.body')

            # Crear issue
            ISSUE_JSON=$(curl -s \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -X POST "https://api.github.com/repos/$OWNER/$REPO/issues" \
              -d "{\"title\":\"$TITLE\",\"body\":\"$BODY\"}")

            ISSUE_ID=$(echo "$ISSUE_JSON" | jq -r '.id')
            NODE_ID=$(echo "$ISSUE_JSON" | jq -r '.node_id')

            # Agregar al proyecto
            curl -s \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -X POST "https://api.github.com/projects/columns/$COLUMN_ID/cards" \
              -d "{\"content_id\":\"$NODE_ID\",\"content_type\":\"Issue\"}"

            echo "✓ Issue creado: $TITLE (ID: $ISSUE_ID)"
          done

          echo "::notice::Todos los issues fueron agregados al proyecto https://github.com/orgs/UPT-FAING-EPIS/projects/248"